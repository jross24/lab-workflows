name: diff

# Shows what a release of the pull request would change in the live stack, as ONE comment that each push updates.
# The README section "The cdk diff comment" explains the design and the security model.
#
# Four jobs, and only the first two hold anything of value:
#   gate     decides if the diff can run (a fork or Dependabot pull request gets no OIDC token).
#   fetch    has the AWS role github-pr-diff. It runs the code of this file only, and it reads two things:
#            the deployed template, the version and the status of each stack.
#   compute  runs the CODE OF THE PULL REQUEST (npm ci, cdk synth). It has no AWS credentials and no write token.
#   report   has the right to write a comment. It runs the scripts of this repository and no code of the pull request.
#
# The caller must give these permissions: contents: read, id-token: write, pull-requests: write.
# The caller must pass its secrets with "secrets: inherit".
on:
  workflow_call:
    inputs:
      stage:
        description: The CDK stage to compare, for example Production. An empty value means the stacks that are not in a stage.
        type: string
        required: false
        default: Production
      account-secret:
        description: The name of the repository secret that holds the ID of the account to read.
        type: string
        required: false
        default: PR_ACCOUNT_ID_PRODUCTION
      stack-names:
        description: The names of the deployed stacks, separated by spaces. The default is the name of the repository.
        type: string
        required: false
        default: ''
      synth-args:
        description: More arguments for cdk synth, for example "-c environment=test".
        type: string
        required: false
        default: ''
      title:
        description: The title of the comment.
        type: string
        required: false
        default: cdk diff against Production
      key:
        description: The key of the comment. Each key has its own comment on the pull request.
        type: string
        required: false
        default: production
      pass-version:
        description: Synthesise with the version that runs now, so that the version number is not a change. Set false for an app that has no version.
        type: boolean
        required: false
        default: true
      tools-ref:
        description: The ref of lab-workflows that the scripts come from. Leave the default. A change of this workflow sets it to the branch under test.
        type: string
        required: false
        default: main

# Each job asks for its own permissions.
permissions: {}

# The artefact names hold the key. A caller can call this workflow more than once in a run (one call for each account),
# and the name of an artefact must be unique in a run.

# A new push replaces the run of the old commit. Two runs could write the comment at the same time.
concurrency:
  group: cdk-diff-${{ github.repository }}-${{ github.event.pull_request.number }}-${{ inputs.key }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jross24/lab-workflows
          ref: ${{ inputs.tools-ref }}
          persist-credentials: false
      - id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          ACCOUNT_ID: ${{ secrets[inputs.account-secret] }}
        run: node actions/cdk-diff/cli.mjs gate

  fetch:
    needs: [gate]
    if: ${{ needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only the OIDC token. The job reads no repository content.
    permissions:
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets[inputs.account-secret] }}:role/github-pr-diff
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
      # The code of this step is the code of this file on main. The role github-pr-diff trusts only that.
      # It writes plain files. The artefact of a public repository is public, so account numbers are removed first.
      - name: read the deployed stacks
        env:
          STACK_NAMES: ${{ inputs.stack-names || github.event.repository.name }}
          ACCOUNT_ID: ${{ secrets[inputs.account-secret] }}
        run: |
          set -euo pipefail
          mkdir deployed
          meta='[]'
          for name in $STACK_NAMES; do
            if ! aws cloudformation describe-stacks --stack-name "$name" --output json > describe.json 2> describe.err; then
              if grep -q "does not exist" describe.err; then
                echo "Stack ${name} is not deployed in this account yet."
                meta="$(jq -c --arg name "$name" '. + [{name: $name, deployed: false, version: null, status: null}]' <<< "$meta")"
                continue
              fi
              cat describe.err
              exit 1
            fi
            aws cloudformation get-template --stack-name "$name" --template-stage Original --query TemplateBody --output json > "deployed/${name}.json"
            if [[ "$(head -c 1 "deployed/${name}.json")" != "{" ]]; then
              echo "::error::The deployed template of ${name} is not JSON. The diff workflow reads JSON templates of CDK only."
              exit 1
            fi
            node -e '
              const fs = require("node:fs");
              const [file, id] = process.argv.slice(1);
              let text = fs.readFileSync(file, "utf8");
              if (id) text = text.split(id).join("[account-id]");
              text = text.replace(/(?<![0-9A-Za-z])[0-9]{12}(?![0-9A-Za-z])/g, "[account-id]");
              fs.writeFileSync(file, text);
            ' "deployed/${name}.json" "$ACCOUNT_ID"
            # The version comes from the template that the diff uses, and not from the stack outputs.
            # While a deployment runs, the template can be newer than the outputs.
            version="$(jq -r '.Outputs.Version.Value // empty | select(type == "string")' "deployed/${name}.json")"
            # The status shows in the comment when it is not a stable *_COMPLETE status. The role reads it with
            # cloudformation:DescribeStacks, the call that this step makes already.
            status="$(jq -r '.Stacks[0].StackStatus // empty | select(type == "string")' describe.json)"
            meta="$(jq -c --arg name "$name" --arg version "$version" --arg status "$status" \
              '. + [{name: $name, deployed: true, version: (if ($version | length) > 0 then $version else null end), status: (if ($status | length) > 0 then $status else null end)}]' <<< "$meta")"
          done
          jq -n --argjson stacks "$meta" '{stacks: $stacks}' > deployed/meta.json
          rm -f describe.json describe.err
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployed-${{ inputs.key }}
          path: deployed
          retention-days: 1
          if-no-files-found: error

  compute:
    needs: [gate, fetch]
    if: ${{ needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # This job runs the code of the pull request. It gets no id-token and no write permission.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jross24/lab-workflows
          ref: ${{ inputs.tools-ref }}
          path: .lab-tools
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deployed-${{ inputs.key }}
          path: deployed
      - name: synthesise and compare
        env:
          STAGE: ${{ inputs.stage }}
          SYNTH_ARGS: ${{ inputs.synth-args }}
          PASS_VERSION: ${{ inputs.pass-version }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .lab-tools/actions/cdk-diff/compute.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diff-${{ inputs.key }}
          path: diff
          retention-days: 1
          if-no-files-found: error

  report:
    needs: [gate, compute]
    if: ${{ needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jross24/lab-workflows
          ref: ${{ inputs.tools-ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: diff-${{ inputs.key }}
          path: diff
      - name: post the comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          KEY: ${{ inputs.key }}
          TITLE: ${{ inputs.title }}
          ACCOUNT_IDS: ${{ secrets[inputs.account-secret] }}
        run: node actions/cdk-diff/cli.mjs report diff
