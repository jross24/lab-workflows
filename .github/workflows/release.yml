name: release

# The release path of a service repository. Call it on a push to main.
# The caller must give these permissions: contents: write, id-token: write.
# The caller must pass its secrets with "secrets: inherit". The README gives the reason.
#
# The order of the jobs:
#   version -> build -> lock-test -> deploy-test -> e2e -> unlock-test
#                                                      \-> deploy-staging -> deploy-production
# Test is shared by all the service repositories. A release holds the lock of Test from lock-test
# to unlock-test. Staging starts only if the E2E suite passed. A failed suite still releases the lock.
on:
  workflow_call:
    inputs:
      run-e2e:
        description: >-
          Run the end-to-end suite of lab-e2e against Test after the deployment, and stop the release
          if it fails. Set it to false only for a repository that has no E2E suite to run.
          The release still takes the lock of Test.
        type: boolean
        required: false
        default: true

# Each job asks for its own permissions.
permissions: {}

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: next
        uses: jross24/lab-workflows/actions/next-version@main
      - name: create the tag on the released commit
        if: steps.next.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.next.outputs.tag }}
        run: gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f "ref=refs/tags/${TAG}" -f "sha=${GITHUB_SHA}" --silent
      - name: write the summary
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: echo "### Release ${TAG} of commit ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"

  # The only job that synthesises. Each deploy job uses the cloud assembly from this job.
  build:
    needs: [version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      digest: ${{ steps.zip.outputs.digest }}
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx cdk synth --quiet -c "version=${VERSION}"
      - id: zip
        name: zip the cloud assembly
        run: |
          (cd cdk.out && zip --quiet --recurse-paths "../cdk-out-${TAG}.zip" .)
          sha256sum "cdk-out-${TAG}.zip" > "cdk-out-${TAG}.zip.sha256"
          digest="$(cut -d ' ' -f 1 "cdk-out-${TAG}.zip.sha256")"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          {
            echo "### Built ${TAG}"
            echo
            echo "Cloud assembly sha256: \`${digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cdk-out
          path: cdk-out-${{ needs.version.outputs.tag }}.zip
          if-no-files-found: error
          compression-level: 0
      # The release keeps the assembly, so the redeploy workflow can deploy this version again later.
      - name: attach the cloud assembly to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "cdk-out-${TAG}.zip" "cdk-out-${TAG}.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag

  # Takes the lock of the shared Test environment. It waits when another release holds the lock.
  # The wait is 20 minutes at most, so the job limit is a little longer.
  lock-test:
    needs: [version, build]
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 25
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-deploy
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
      - uses: jross24/lab-workflows/actions/lock-acquire@main

  # The limit of the job is shorter than the 30 minutes of the lock. So a stuck deployment ends
  # before the lock expires and another release takes Test.
  deploy-test:
    needs: [version, build, lock-test]
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cdk-out
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-deploy
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
      - uses: jross24/lab-workflows/actions/deploy@main
        with:
          assembly: cdk-out-${{ needs.version.outputs.tag }}.zip
          digest: ${{ needs.build.outputs.digest }}
          stage: Test
          version: ${{ needs.version.outputs.version }}

  # The end-to-end suite of lab-e2e, against Test. This job is a call of a reusable workflow, so it
  # cannot set an environment. The job inside run.yml sets it. The README explains which secrets and
  # which OIDC identity that job gets when a service repository started the release.
  # "secrets: inherit" is needed at each level. GitHub passes secrets only to the workflow that a job calls.
  e2e:
    needs: [deploy-test]
    if: ${{ inputs.run-e2e }}
    permissions:
      id-token: write
      contents: read
    uses: jross24/lab-e2e/.github/workflows/run.yml@main
    with:
      environment: test
    secrets: inherit

  # Shows in the summary of the release which versions the E2E suite tested.
  e2e-summary:
    needs: [e2e]
    if: ${{ always() && needs.e2e.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: write the summary
        env:
          RESULT: ${{ needs.e2e.result }}
          WEB: ${{ needs.e2e.outputs.web-version }}
          CATALOGUE: ${{ needs.e2e.outputs.catalogue-version }}
          ACCOUNT: ${{ needs.e2e.outputs.account-version }}
          CORE: ${{ needs.e2e.outputs.core-version }}
          E2E_COMMIT: ${{ needs.e2e.outputs.commit }}
        run: |
          {
            echo "### E2E against Test: ${RESULT}"
            echo
            if [[ -n "$WEB$CATALOGUE$ACCOUNT$CORE" ]]; then
              echo "| Application | Version tested |"
              echo "| --- | --- |"
              echo "| web | \`${WEB:-not recorded}\` |"
              echo "| catalogue | \`${CATALOGUE:-not recorded}\` |"
              echo "| account | \`${ACCOUNT:-not recorded}\` |"
              echo "| core | \`${CORE:-not recorded}\` |"
              echo
            else
              echo "The E2E run recorded no version."
              echo
            fi
            echo "lab-e2e commit: \`${E2E_COMMIT:-unknown}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Releases the lock of Test. It runs when the suite passed, when it failed, when deploy-test failed
  # and when the run is cancelled, but not when the lock job never ran. The release of the lock
  # never fails because of the lock itself. If this job cannot run, the lock expires after 30 minutes.
  unlock-test:
    needs: [lock-test, deploy-test, e2e]
    if: ${{ always() && needs.lock-test.result != 'skipped' }}
    runs-on: ubuntu-latest
    environment: test
    timeout-minutes: 5
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-deploy
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
      - uses: jross24/lab-workflows/actions/lock-release@main

  # Staging needs a passed E2E suite. With run-e2e set to false, a skipped suite is accepted, but only
  # when Test was deployed. A deploy-test that failed also skips the suite, and that must stop the release.
  deploy-staging:
    needs: [version, build, deploy-test, e2e]
    if: >-
      ${{ !cancelled()
      && needs.deploy-test.result == 'success'
      && (needs.e2e.result == 'success' || (needs.e2e.result == 'skipped' && !inputs.run-e2e)) }}
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cdk-out
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-deploy
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
      - uses: jross24/lab-workflows/actions/deploy@main
        with:
          assembly: cdk-out-${{ needs.version.outputs.tag }}.zip
          digest: ${{ needs.build.outputs.digest }}
          stage: Staging
          version: ${{ needs.version.outputs.version }}

  deploy-production:
    needs: [version, build, deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cdk-out
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-deploy
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
      - uses: jross24/lab-workflows/actions/deploy@main
        with:
          assembly: cdk-out-${{ needs.version.outputs.tag }}.zip
          digest: ${{ needs.build.outputs.digest }}
          stage: Production
          version: ${{ needs.version.outputs.version }}
