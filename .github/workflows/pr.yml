name: pr

# The checks of a pull request in a service repository.
# The jobs have no AWS access, except the job diff. It calls diff.yml, which reads the deployed stack of
# Production with a role that can only read. The README section "The cdk diff comment" explains the security model.
# The caller must give these permissions: contents: read, id-token: write, pull-requests: write.
# The caller must pass its secrets with "secrets: inherit".
# The job shared compares the shared files of the service with the commit of lab-workflows that shared.lock.json names. It needs no AWS access.
# The job contracts compares contract.json and expectations.json with the releases that run in Production. It needs no AWS access.
on:
  workflow_call:
    inputs:
      tools-ref:
        description: The ref of lab-workflows that the scripts of the diff come from. Leave the default. A test of a branch sets it.
        type: string
        required: false
        default: main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx cdk synth --quiet

  # --- The scans: dependencies, secrets and actionlint (lab-platform#22 and lab-platform#30) ---
  # Each job asks for read access to the contents only. The jobs need nothing more.
  # They use the actions of this repository with @main, like release.yml. The README explains why.

  # Fails when the pull request adds or changes a dependency with a known vulnerability of severity high or critical.
  # It compares the dependency graph of the base with the one of the head, so a finding that was already in the
  # base (for example lab-platform#15) does not fail it. It needs no install.
  # The list accepted-advisories.json of this repository names the advisories that have no fix yet, each with a date.
  # The job fetches the list from this repository at tools-ref (the job runs in the caller repository, so the pull request
  # cannot change the list). The script passes the ids that are not expired to the action. An expired id fails the job again.
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jross24/lab-workflows
          ref: ${{ inputs.tools-ref }}
          path: .lab-tools
          persist-credentials: false
      - id: accepted
        run: node .lab-tools/actions/accepted-advisories/cli.mjs allowed .lab-tools/accepted-advisories.json
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development
          license-check: false
          show-patched-versions: true
          allow-ghsas: ${{ steps.accepted.outputs.allow-ghsas }}

  # Fails when a commit of the pull request has a secret. It scans only the commits of the pull request.
  # It never prints the value of a secret.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jross24/lab-workflows/actions/install-tool@main
        with:
          tool: gitleaks
      - uses: jross24/lab-workflows/actions/secret-scan@main

  # Runs actionlint on the workflow files when the pull request changes something under .github/.
  # Otherwise the job passes and prints a notice that it skipped the check.
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        uses: jross24/lab-workflows/actions/changed-paths@main
        with:
          paths: .github/
          label: actionlint
      - if: steps.changes.outputs.changed == 'true'
        uses: jross24/lab-workflows/actions/install-tool@main
        with:
          tool: actionlint
      - if: steps.changes.outputs.changed == 'true'
        run: actionlint

  # Compares contract.json and expectations.json with the contract and the expectations of the releases that run in Production
  # (lab-platform#34). A breaking change of a contract fails the job, unless the pull request has the label
  # breaking-change-approved. A consumer that would break always fails it. The job reads only public data and the labels,
  # so it needs no AWS access and no write permission. A repository without contract files gets a notice, and the job passes.
  # The name of the job is part of the name of the required check: pr / contracts.
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jross24/lab-workflows/actions/contract-check@main
        with:
          token: ${{ github.token }}

  # Fails when a shared file of the service is not byte-equal to the file in lab-workflows at the commit that
  # shared.lock.json names (lab-platform#26). The check compares with the PINNED commit and not with main, so a pull request
  # never fails because lab-workflows moved. It fails only when someone edits a copy by hand or forgets a file. The message
  # names the file and the sync command. A repository without a pin file gets a notice, and the job passes.
  # The scripts come from this repository at tools-ref. The files to compare with come from the pinned commit. The pin
  # cannot name another repository: the checkout below always uses jross24/lab-workflows. The name of the job is part
  # of the name of the required check: pr / shared.
  shared:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jross24/lab-workflows
          ref: ${{ inputs.tools-ref }}
          path: .lab-tools
          persist-credentials: false
      - id: pin
        run: node .lab-tools/actions/shared-files/cli.mjs pin
      - if: steps.pin.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jross24/lab-workflows
          ref: ${{ steps.pin.outputs.commit }}
          path: .lab-shared
          persist-credentials: false
      - if: steps.pin.outputs.present == 'true'
        run: node .lab-tools/actions/shared-files/cli.mjs check .lab-shared/shared .

  # Shows what a release would change in Production, as one comment that each push updates (lab-platform#13).
  # A delete or a replacement of a stateful resource fails this job until the pull request has the label
  # destructive-change-approved. A fork pull request has no OIDC token, so the job skips the diff with a notice.
  # The ref @main of diff.yml is needed: the role github-pr-diff trusts only diff.yml on main.
  diff:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: jross24/lab-workflows/.github/workflows/diff.yml@main
    with:
      tools-ref: ${{ inputs.tools-ref }}
    secrets: inherit
