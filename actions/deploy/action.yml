name: deploy
description: Deploys one stage from the cloud assembly that the build job made. It does not synthesise.

# The job must do these things first:
# - check out the commit of the release, for package-lock.json
# - put the zipped cloud assembly on the disk
# - log in to AWS
#
# The action also checks the parameters that the service publishes for its consumers (for example /lab/core/url).
# It reads them before and after the deployment, and it warns if a value changed. It needs ssm:GetParameters on /lab/*,
# the permission that the preflight check uses. The README section "Provider parameters" explains the check.
inputs:
  assembly:
    description: The path of the zipped cloud assembly.
    required: true
  digest:
    description: The SHA-256 of the zip that the build job made.
    required: true
  stage:
    description: The CDK stage to deploy, for example Test.
    required: true
  version:
    description: The version that the deployed stack must report.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
        cache: npm

    # The lockfile pins the CDK CLI. A deploy runs no package code, so it needs no install scripts.
    - shell: bash
      run: npm ci --ignore-scripts

    - name: check that this is the assembly of the build job
      shell: bash
      env:
        ASSEMBLY: ${{ inputs.assembly }}
        DIGEST: ${{ inputs.digest }}
      run: |
        actual="$(sha256sum "$ASSEMBLY" | cut -d ' ' -f 1)"
        if [[ "$actual" != "$DIGEST" ]]; then
          echo "::error::The cloud assembly is not the one that the build job made. Expected sha256 $DIGEST, got $actual."
          exit 1
        fi
        rm -rf cdk.out
        unzip -q "$ASSEMBLY" -d cdk.out

    # The two steps of the check of the published parameters never fail the job (the script returns 0, and continue-on-error
    # is a second guard). A stale consumer is no fault of the provider, and a check that cannot run is no fault of the release.
    - name: read the published parameters before the deployment
      continue-on-error: true
      shell: bash
      env:
        STAGE: ${{ inputs.stage }}
      run: node "$GITHUB_ACTION_PATH/../published-params/cli.mjs" snapshot --assembly cdk.out --stage "$STAGE" --out "$RUNNER_TEMP/published-params-before.json"

    - name: cdk deploy
      shell: bash
      env:
        STAGE: ${{ inputs.stage }}
      run: npx cdk deploy --app cdk.out "${STAGE}/*" --require-approval never --outputs-file "$RUNNER_TEMP/cdk-outputs.json"

    - name: compare the published parameters after the deployment
      continue-on-error: true
      shell: bash
      env:
        STAGE: ${{ inputs.stage }}
      run: node "$GITHUB_ACTION_PATH/../published-params/cli.mjs" compare --before "$RUNNER_TEMP/published-params-before.json" --stage "$STAGE" --contract contract.json

    - name: report the deployed version
      shell: bash
      env:
        DIGEST: ${{ inputs.digest }}
        STAGE: ${{ inputs.stage }}
        VERSION: ${{ inputs.version }}
      run: |
        # The stack has an output named Version. CloudFormation returns it after the deployment.
        deployed="$(jq -r '[.[] | .Version // empty] | unique | join(", ")' "$RUNNER_TEMP/cdk-outputs.json")"
        if [[ "$deployed" != "$VERSION" ]]; then
          echo "::error::Stage $STAGE reports version \"$deployed\", but the release is $VERSION."
          exit 1
        fi
        {
          echo "### $STAGE runs version $deployed"
          echo
          echo "Cloud assembly sha256: \`$DIGEST\`"
        } >> "$GITHUB_STEP_SUMMARY"
